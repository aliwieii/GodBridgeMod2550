name: Build GodBridgeUltra

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. سحب ملفات المشروع من المستودع
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. تثبيت Java 8 باستخدام الإصدار الحديث v5 لتفادي التحذيرات
      - name: Set up Java 8
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'

      # 3. معالجة نهايات أسطر الويندوز وإعطاء صلاحية التشغيل لملف gradlew
      - name: Prepare Gradle Wrapper
        run: |
          # البحث عن ملف gradlew وإصلاح نهايات الأسطر وإعطائه صلاحية التنفيذ
          find . -name "gradlew" -exec sed -i 's/\r$//' {} +
          find . -name "gradlew" -exec chmod +x {} +

      # 4. بناء ملف المود والتنظيف
      - name: Build mod
        run: |
          # التحقق مما إذا كانت الملفات في المسار الرئيسي أو داخل مجلد فرعي
          if [ -f "./gradlew" ]; then
            ./gradlew clean build --no-daemon --stacktrace
          elif [ -f "./GodBridgeUltra/gradlew" ]; then
            cd GodBridgeUltra
            ./gradlew clean build --no-daemon --stacktrace
          else
            echo "لم يتم العثور على ملف gradlew في المستودع!"
            exit 1
          fi

      # 5. رفع ملف الـ JAR التنفيذي
      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GodBridgeUltra-1.8.9-JAR
          path: "**/build/libs/*.jar"
          if-no-files-found: error
