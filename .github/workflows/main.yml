name: Build GodBridgeUltra

# شروط تشغيل خطة البناء: يدوياً أو عند رفع كود جديد
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    # استخدام بيئة أوبونتو
    runs-on: ubuntu-latest

    steps:
      # الخطوة 1: تنزيل ملفات مشروعك من المستودع إلى جهاز البناء
      - name: Checkout repository
        uses: actions/checkout@v4

      # الخطوة 2: تثبيت بيئة Java 8 المطلوبة حصراً لـ Forge 1.8.9
      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      # الخطوة 3: إعطاء صلاحية التنفيذ لملف gradlew داخل نظام لينكس
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # الخطوة 4: تشغيل البناء باستخدام Gradle Wrapper المدمج في المشروع وتجاوز مشاكل الكاش
      - name: Build mod with Gradle Wrapper
        run: ./gradlew clean build --no-daemon --stacktrace

      # الخطوة 5: رفع ملف الـ JAR الناتج ليكون متاحاً للتحميل تحت قسم Artifacts
      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GodBridgeUltra-1.8.9-JAR
          path: build/libs/*.jar
          if-no-files-found: error
